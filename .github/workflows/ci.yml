name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The job id/name "ci" is the required status check on main. Do not rename it without
  # updating the branch protection rule.
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GODOT_VERSION: "4.7.2"
      GDTOOLKIT_VERSION: "4.5.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gdtoolkit
        run: pip install "gdtoolkit==${GDTOOLKIT_VERSION}"

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          zip="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o "$zip" "$base/$zip"
          curl -fsSL -o SHA512-SUMS.txt "$base/SHA512-SUMS.txt"
          grep " ${zip}\$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "$zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          rm "$zip" SHA512-SUMS.txt

      - name: Run checks
        env:
          GODOT: /home/runner/godot/godot
        run: scripts/check.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test_results/
          if-no-files-found: ignore

  # Windows build of the game, downloadable from the run's artifacts. Not a required check.
  # The 1.2 GB template archive is downloaded only on a cache miss; just the Windows release
  # template (~100 MB) is kept.
  export-windows:
    name: export-windows
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GODOT_VERSION: "4.7.2"
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          zip="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o "$zip" "$base/$zip"
          curl -fsSL -o SHA512-SUMS.txt "$base/SHA512-SUMS.txt"
          grep " ${zip}\$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "$zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          rm "$zip" SHA512-SUMS.txt

      - name: Cache Windows export template
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: templates-${{ env.GODOT_VERSION }}-windows-x86_64

      - name: Install Windows export template
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: |
          dir=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dir" && cd "$(mktemp -d)"
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          tpz="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          curl -fsSL -o "$tpz" "$base/$tpz"
          curl -fsSL -o SHA512-SUMS.txt "$base/SHA512-SUMS.txt"
          grep " ${tpz}\$" SHA512-SUMS.txt | sha512sum -c -
          unzip -j -q "$tpz" templates/windows_release_x86_64.exe templates/version.txt -d "$dir"
          rm "$tpz"

      - name: Export
        run: |
          ~/godot/godot --headless --import
          mkdir -p build/windows
          ~/godot/godot --headless --export-release "Windows Desktop" build/windows/Hanse.exe
          test -s build/windows/Hanse.exe
          ls -la build/windows

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: hanse-windows
          path: build/windows/
